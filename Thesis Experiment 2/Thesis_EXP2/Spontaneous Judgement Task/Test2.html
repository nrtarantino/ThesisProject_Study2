<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forced Choice Task</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .canvas-container {
            display: flex;
            gap: 0;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .canvas-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background: #1a1a1a;
        }

        .slope-text {
            color: #fff;
            font-size: 18px;
            margin-top: 10px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .divider {
            width: 2px;
            height: 800px;
            background-color: #666;
            margin: 0 20px;
        }

        .instruction-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 40px;
        }

        .block-info {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 12px;
            color: #888;
            line-height: 1.4;
        }

        .instruction-text {
            font-size: 24px;
            text-align: center;
            margin-bottom: 40px;
            max-width: 800px;
            line-height: 1.6;
        }

        .start-button {
            padding: 15px 40px;
            font-size: 18px;
            background-color: #4a9eff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .start-button:hover {
            background-color: #3a8eef;
        }

        .feedback-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
        }

        .feedback-screen.correct {
            background-color: #00ff00;
        }

        .feedback-screen.incorrect {
            background-color: #ff0000;
        }

        .white-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            z-index: 998;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="instruction-screen" id="instructionScreen">
        <div class="block-info" id="blockInfo"></div>
        <div class="instruction-text" id="instructionText">
            Instructions will appear here
        </div>
        <button class="start-button" id="startButton">Start</button>
    </div>
    
    <div class="white-screen hidden" id="whiteScreen"></div>
    <div class="feedback-screen hidden" id="feedbackScreen"></div>
    
    <div class="canvas-container">
        <div class="canvas-wrapper">
            <canvas id="scatterplotCanvas1" width="800" height="800"></canvas>
        </div>
        <div class="divider"></div>
        <div class="canvas-wrapper">
            <canvas id="scatterplotCanvas2" width="800" height="800"></canvas>
        </div>
    </div>

    <script>
        const canvas1 = document.getElementById('scatterplotCanvas1');
        const ctx1 = canvas1.getContext('2d');
        const canvas2 = document.getElementById('scatterplotCanvas2');
        const ctx2 = canvas2.getContext('2d');
        
        // Constants
        const CANVAS_SIZE = 800;
        const MARGIN = 80;
        const PLOT_SIZE = CANVAS_SIZE - 2 * MARGIN;
        const DOT_SIZE_MM = 2; // 2mm dot
        const VIEWING_DISTANCE_CM = 50; // 50cm viewing distance
        // Convert 2mm to pixels (approximate: 1mm ≈ 3.78 pixels at 96 DPI)
        // For 0.23° visual angle at 50cm: approximately 2mm = ~4 pixels
        const DOT_RADIUS = 4; // pixels (approximately 2mm)
        
        // Noise parameter (will be set per big block)
        let SIGMA = 0.1;
        
        // Axes visibility toggle - set to true to show axes, false to hide them
        const SHOW_AXES = true;
        
        // Big block structure
        // Each big block has a noise parameter and contains 2 regular blocks
        let currentBigBlockIndex = 0;
        let currentBlockInBigBlock = 0;
        let bigBlockPattern = []; // Pattern for current big block: [1,2] or [2,1]
        
        // Define big blocks with their noise parameters
        // You can modify this array to add more big blocks with different noise values
        const BIG_BLOCKS = [
            
            
            { sigma: 0.2},
           
            // Add more big blocks as needed
        ];
        
        // Initialize big block pattern (randomly choose starting block type)
        function initializeBigBlockPattern() {
            const startWithOne = Math.random() < 0.5;
            if (startWithOne) {
                bigBlockPattern = [1, 2]; // A=target, B=target
            } else {
                bigBlockPattern = [2, 1]; // B=target, A=target
            }
            console.log('Pattern initialized:', bigBlockPattern, 'startWithOne:', startWithOne);
        }
        
        // Set block configuration based on block type (1 or 2)
        function setBlockType(blockType) {
            if (blockType === 1) {
                // Block type 1: A = target, B = distractor
                setBlock('A', 'B');
            } else {
                // Block type 2: B = target, A = distractor
                setBlock('B', 'A');
            }
        }
        
        // Stimulus definitions
        // Each stimulus has an array of {slope, n} pairs
        // When generating, one pair is randomly selected, so slope and n are always paired together
        const STIMULUS_A = {
            name: 'A',
            pairs: [
                { slope: 0.6, n: 18 },
                { slope: 0.7, n: 19 },
                { slope: 0.8, n: 20 },
                { slope: 0.9, n: 21 },
                { slope: 1, n: 22 }
            ]
        };
        
        const STIMULUS_B = {
            name: 'B',
            pairs: [
                { slope: -1, n: 8 },
                { slope: -0.9, n: 9 },
                { slope: -0.8, n: 10 },
                { slope: -0.7, n: 11 },
                { slope: -0.6, n: 12 },
            ]
        };
        
        // Block configuration
        // In each block, one stimulus is target and one is distractor
        let currentBlock = {
            target: 'A',  // 'A' or 'B' - this is the target stimulus
            distractor: 'B'  // 'A' or 'B' - this is the distractor stimulus
        };
        
        // Function to get stimulus parameters
        function getStimulusParams(stimulusType) {
            return stimulusType === 'A' ? STIMULUS_A : STIMULUS_B;
        }
        
        // Function to set block configuration
        function setBlock(target, distractor) {
            currentBlock.target = target;
            currentBlock.distractor = distractor;
        }
        
        // Axis range: extend 0.25 on each side
        const X_MIN = -0.25;
        const X_MAX = 1.25;
        const Y_MIN = -0.25;
        const Y_MAX = 1.25;
        
        // Generate random number from normal distribution (Box-Muller transform)
        function randomNormal(mean = 0, stdDev = 1) {
            const u1 = Math.random();
            const u2 = Math.random();
            const z0 = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
            return z0 * stdDev + mean;
        }
        
        // Generate scatterplot data according to the algorithm
        function generateData(n, alpha, sigma) {
            let valid = false;
            let x, y;
            
            while (!valid) {
                // Generate equally spaced x values from 0 to 1
                x = [];
                for (let i = 0; i < n; i++) {
                    x.push(i / (n - 1));
                }
                
                // Generate y values: yi = α * xi + εi
                y = [];
                for (let i = 0; i < n; i++) {
                    const epsilon = sigma > 0 ? randomNormal(0, sigma) : 0;
                    y.push(alpha * x[i] + epsilon);
                }
                
                // Adjust vertically so center of mass (mean) of y-values is at 0.5
                // Calculate mean y value (center of mass)
                const meanY = y.reduce((sum, val) => sum + val, 0) / n;
                // Adjust all y values so mean becomes 0.5
                const adjustment = 0.5 - meanY;
                y = y.map(yi => yi + adjustment);
                
                // Check if all points are within bounds AFTER adjustment
                valid = true;
                for (let i = 0; i < n; i++) {
                    if (y[i] < -0.27 || y[i] > 1.27) {
                        valid = false;
                        break;
                    }
                }
            }
            
            return { x, y };
        }
        
        // Convert normalized coordinates to canvas coordinates
        // Maps from [X_MIN, X_MAX] to [MARGIN, MARGIN + PLOT_SIZE]
        function toCanvasX(normalizedX) {
            const normalized = (normalizedX - X_MIN) / (X_MAX - X_MIN);
            return MARGIN + normalized * PLOT_SIZE;
        }
        
        function toCanvasY(normalizedY) {
            // Flip y-axis (canvas y increases downward)
            // Maps from [Y_MIN, Y_MAX] to [MARGIN, MARGIN + PLOT_SIZE]
            const normalized = (normalizedY - Y_MIN) / (Y_MAX - Y_MIN);
            return MARGIN + (1 - normalized) * PLOT_SIZE;
        }
        
        // Draw axes with ticks
        function drawAxes(ctx) {
            // Check if axes should be drawn
            if (!SHOW_AXES) {
                return;
            }
            
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 1;
            
            // Draw x-axis at y = -0.25 (bottom edge, flush with left)
            const xAxisY = toCanvasY(Y_MIN); // y position at bottom edge
            ctx.beginPath();
            ctx.moveTo(toCanvasX(X_MIN), xAxisY);
            ctx.lineTo(toCanvasX(X_MAX), xAxisY);
            ctx.stroke();
            
            // Draw y-axis at x = -0.25 (left edge, flush with bottom)
            const yAxisX = toCanvasX(X_MIN); // x position at left edge
            ctx.beginPath();
            ctx.moveTo(yAxisX, toCanvasY(Y_MIN));
            ctx.lineTo(yAxisX, toCanvasY(Y_MAX));
            ctx.stroke();
            
            // Draw ticks on x-axis at 0, 0.5, 1
            const tickPositions = [0, 0.5, 1];
            const tickLength = 5;
            
            tickPositions.forEach(pos => {
                const x = toCanvasX(pos);
                const y = xAxisY;
                
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x, y + tickLength);
                ctx.stroke();
            });
            
            // Draw ticks on y-axis at 0, 0.5, 1
            tickPositions.forEach(pos => {
                const x = yAxisX;
                const y = toCanvasY(pos);
                
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x - tickLength, y);
                ctx.stroke();
            });
        }
        
        // Calculate slope using linear regression
        function calculateSlope(data) {
            const n = data.x.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
            
            for (let i = 0; i < n; i++) {
                sumX += data.x[i];
                sumY += data.y[i];
                sumXY += data.x[i] * data.y[i];
                sumX2 += data.x[i] * data.x[i];
            }
            
            // Slope = (n*ΣXY - ΣX*ΣY) / (n*ΣX² - (ΣX)²)
            const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
            return slope;
        }
        
        // Calculate R-squared (coefficient of determination)
        function calculateRSquared(data) {
            const n = data.x.length;
            if (n < 2) return 0;
            
            // Calculate mean of y
            const meanY = data.y.reduce((sum, val) => sum + val, 0) / n;
            
            // Calculate slope and intercept for regression line
            let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
            for (let i = 0; i < n; i++) {
                sumX += data.x[i];
                sumY += data.y[i];
                sumXY += data.x[i] * data.y[i];
                sumX2 += data.x[i] * data.x[i];
            }
            
            const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;
            
            // Calculate SS_res (sum of squared residuals) and SS_tot (total sum of squares)
            let ssRes = 0; // Sum of squared residuals
            let ssTot = 0; // Total sum of squares
            
            for (let i = 0; i < n; i++) {
                const yPredicted = slope * data.x[i] + intercept;
                const residual = data.y[i] - yPredicted;
                ssRes += residual * residual;
                
                const deviation = data.y[i] - meanY;
                ssTot += deviation * deviation;
            }
            
            // R² = 1 - (SS_res / SS_tot)
            if (ssTot === 0) return 1; // Perfect fit (all y values are the same)
            const rSquared = 1 - (ssRes / ssTot);
            return rSquared;
        }
        
        // Draw scatterplot
        function drawScatterplot(ctx, data) {
            ctx.fillStyle = '#fff';
            
            data.x.forEach((xi, i) => {
                const canvasX = toCanvasX(xi);
                const canvasY = toCanvasY(data.y[i]);
                
                ctx.beginPath();
                ctx.arc(canvasX, canvasY, DOT_RADIUS, 0, 2 * Math.PI);
                ctx.fill();
            });
        }
        
        // Generate a stimulus (target or distractor)
        // If specificSlope and specificN are provided, use those instead of randomly picking a pair
        function generateStimulus(stimulusType, specificSlope = null, specificN = null) {
            let n, slopeParam;
            
            if (specificSlope !== null && specificN !== null) {
                // Use provided parameters (for probe trials)
                n = specificN;
                slopeParam = specificSlope;
            } else {
                // Randomly pick one pair from the pairs array (normal trials)
                const params = getStimulusParams(stimulusType);
                const pair = params.pairs[Math.floor(Math.random() * params.pairs.length)];
                n = pair.n;
                slopeParam = pair.slope;
            }
            
            const data = generateData(n, slopeParam, SIGMA);
            // Calculate actual slope and R-squared from the generated data (what's actually displayed)
            const calculatedSlope = calculateSlope(data);
            const rSquared = calculateRSquared(data);
            // Store actual number of points from data (what's actually displayed)
            const actualN = data.x.length;
            return {
                data: data,
                n: actualN,  // Store actual number of points displayed
                slope: calculatedSlope,  // Calculated from displayed data
                rSquared: rSquared,  // Calculated from displayed data
                slopeParam: slopeParam  // Store the parameter used (for reference)
            };
        }
        
        // Display a stimulus on a canvas
        function displayStimulus(ctx, stimulusType) {
            // Clear canvas
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            
            // Draw axes
            drawAxes(ctx);
            
            // Generate and draw scatterplot
            const stimulus = generateStimulus(stimulusType);
            drawScatterplot(ctx, stimulus.data);
        }
        
        // Trial management
        let currentTrialIndex = 0;
        let trials = [];
        let trainingTrials = []; // Separate array for training trials
        let isInTrainingPhase = false; // Track if we're in training phase
        let trainingTrialResults = []; // Track accuracy of training trials
        let trialStartTime = 0;
        let responseReceived = false;
        let trialTimeout = null;
        let isWaitingForResponse = false;
        
        // Data recording
        let globalTrialNumber = 0; // Counts from 1 across all trials
        let trialData = []; // Array to store all trial data
        let currentTrialStimulusData = null; // Store stimulus data for current trial
        
        // Generate training trials (8 initial, can add more if needed)
        // Training trials are simple: half target on left, half on right, no probe trials
        function generateTrainingTrials(count = 8) {
            const targetStimulus = currentBlock.target;
            const distractorStimulus = currentBlock.distractor;
            
            const newTrainingTrials = [];
            
            // Create equal number of left and right target trials
            const halfCount = Math.floor(count / 2);
            const remainder = count % 2;
            
            // Half with target on left
            for (let i = 0; i < halfCount + remainder; i++) {
                newTrainingTrials.push({
                    left: targetStimulus,
                    right: distractorStimulus,
                    targetSide: 'left',
                    isProbe: false,
                    trialType: 'training'
                });
            }
            
            // Half with target on right
            for (let i = 0; i < halfCount; i++) {
                newTrainingTrials.push({
                    left: distractorStimulus,
                    right: targetStimulus,
                    targetSide: 'right',
                    isProbe: false,
                    trialType: 'training'
                });
            }
            
            // Randomize training trials
            for (let i = newTrainingTrials.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newTrainingTrials[i], newTrainingTrials[j]] = [newTrainingTrials[j], newTrainingTrials[i]];
            }
            
            return newTrainingTrials;
        }
        
        // Generate 48 regular trials + 16 probe trials for a block
        // Regular trials: 24 with target on left, 24 with target on right
        // Probe trials: 8 switchN (swap N values), 8 switchSlope (swap slope values)
        function generateTrials() {
            const targetStimulus = currentBlock.target;
            const distractorStimulus = currentBlock.distractor;
            const targetParams = getStimulusParams(targetStimulus);
            const distractorParams = getStimulusParams(distractorStimulus);
            
            trials = [];
            
            // 24 regular trials with target on left
            for (let i = 0; i < 24; i++) {
                trials.push({
                    left: targetStimulus,
                    right: distractorStimulus,
                    targetSide: 'left',
                    isProbe: false,
                    trialType: 'regular'
                });
            }
            
            // 24 regular trials with target on right
            for (let i = 0; i < 24; i++) {
                trials.push({
                    left: distractorStimulus,
                    right: targetStimulus,
                    targetSide: 'right',
                    isProbe: false,
                    trialType: 'regular'
                });
            }
            
            // 8 probe trials: switch N values
            for (let i = 0; i < 8; i++) {
                // Randomly pick pairs from target and distractor
                const targetPair = targetParams.pairs[Math.floor(Math.random() * targetParams.pairs.length)];
                const distractorPair = distractorParams.pairs[Math.floor(Math.random() * distractorParams.pairs.length)];
                
                // Swap N values: target gets distractor's N, distractor gets target's N
                const swappedTargetN = distractorPair.n;
                const swappedDistractorN = targetPair.n;
                
                // Randomly assign target side
                const targetSide = Math.random() < 0.5 ? 'left' : 'right';
                
                trials.push({
                    left: targetSide === 'left' ? targetStimulus : distractorStimulus,
                    right: targetSide === 'right' ? targetStimulus : distractorStimulus,
                    targetSide: targetSide,
                    isProbe: true,
                    probeType: 'switchN',
                    trialType: 'probe',
                    // Store swapped parameters for stimulus generation
                    probeParams: {
                        targetSlope: targetPair.slope,
                        targetN: swappedTargetN,
                        distractorSlope: distractorPair.slope,
                        distractorN: swappedDistractorN
                    }
                });
            }
            
            // 8 probe trials: switch slope values
            for (let i = 0; i < 8; i++) {
                // Randomly pick pairs from target and distractor
                const targetPair = targetParams.pairs[Math.floor(Math.random() * targetParams.pairs.length)];
                const distractorPair = distractorParams.pairs[Math.floor(Math.random() * distractorParams.pairs.length)];
                
                // Swap slope values: target gets distractor's slope, distractor gets target's slope
                const swappedTargetSlope = distractorPair.slope;
                const swappedDistractorSlope = targetPair.slope;
                
                // Randomly assign target side
                const targetSide = Math.random() < 0.5 ? 'left' : 'right';
                
                trials.push({
                    left: targetSide === 'left' ? targetStimulus : distractorStimulus,
                    right: targetSide === 'right' ? targetStimulus : distractorStimulus,
                    targetSide: targetSide,
                    isProbe: true,
                    probeType: 'switchSlope',
                    trialType: 'probe',
                    // Store swapped parameters for stimulus generation
                    probeParams: {
                        targetSlope: swappedTargetSlope,
                        targetN: targetPair.n,
                        distractorSlope: swappedDistractorSlope,
                        distractorN: distractorPair.n
                    }
                });
            }
            
            // Randomize all trials (regular + probe)
            for (let i = trials.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [trials[i], trials[j]] = [trials[j], trials[i]];
            }
        }
        
        // Display a trial
        function presentTrial(trial) {
            // Clear both canvases
            ctx1.fillStyle = '#1a1a1a';
            ctx1.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            ctx2.fillStyle = '#1a1a1a';
            ctx2.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            
            // Draw axes on both
            drawAxes(ctx1);
            drawAxes(ctx2);
            
            // Generate stimuli - use swapped parameters for probe trials
            let leftStimulus, rightStimulus;
            
            if (trial.isProbe && trial.probeParams) {
                // Probe trial: use swapped parameters
                // Determine which side has target and which has distractor
                const leftIsTarget = trial.targetSide === 'left';
                const rightIsTarget = trial.targetSide === 'right';
                
                if (leftIsTarget) {
                    // Left is target, right is distractor
                    leftStimulus = generateStimulus(trial.left, trial.probeParams.targetSlope, trial.probeParams.targetN);
                    rightStimulus = generateStimulus(trial.right, trial.probeParams.distractorSlope, trial.probeParams.distractorN);
                } else {
                    // Right is target, left is distractor
                    leftStimulus = generateStimulus(trial.left, trial.probeParams.distractorSlope, trial.probeParams.distractorN);
                    rightStimulus = generateStimulus(trial.right, trial.probeParams.targetSlope, trial.probeParams.targetN);
                }
            } else {
                // Regular trial: use normal generation
                leftStimulus = generateStimulus(trial.left);
                rightStimulus = generateStimulus(trial.right);
            }
            
            drawScatterplot(ctx1, leftStimulus.data);
            drawScatterplot(ctx2, rightStimulus.data);
            
            // Store stimulus data for recording - left and right stimuli
            currentTrialStimulusData = {
                targetSide: trial.targetSide,
                isProbe: trial.isProbe || false,
                probeType: trial.probeType || null,
                leftStim: {
                    slope: leftStimulus.slope,
                    n: leftStimulus.n,
                    rSquared: leftStimulus.rSquared
                },
                rightStim: {
                    slope: rightStimulus.slope,
                    n: rightStimulus.n,
                    rSquared: rightStimulus.rSquared
                }
            };
            
            // Reset response tracking
            responseReceived = false;
            isWaitingForResponse = true;
            trialStartTime = Date.now();
            
            // Set timeout for 3000ms
            trialTimeout = setTimeout(() => {
                if (!responseReceived) {
                    handleTrialResponse(null); // null means timeout/no response
                }
            }, 3000);
        }
        
        // Handle response to a trial
        // responseKey: 'A' for left, 'L' for right, or null for timeout
        function handleTrialResponse(responseKey) {
            if (!isWaitingForResponse) return;
            
            responseReceived = true;
            isWaitingForResponse = false;
            
            if (trialTimeout) {
                clearTimeout(trialTimeout);
                trialTimeout = null;
            }
            
            // Get current trial (either from trainingTrials or trials array)
            const trial = isInTrainingPhase ? trainingTrials[currentTrialIndex] : trials[currentTrialIndex];
            const reactionTime = Date.now() - trialStartTime;
            
            // Determine correctness: A key for left target, L key for right target
            // Probe trials are always marked as correct regardless of response
            let correct = false;
            if (trial.isProbe) {
                // Probe trials always get green feedback (correct)
                correct = true;
            } else {
                // Regular/training trials: check if response matches target side
                if (responseKey === 'A' && trial.targetSide === 'left') {
                    correct = true;
                } else if (responseKey === 'L' && trial.targetSide === 'right') {
                    correct = true;
                } else if (responseKey === null) {
                    // Timeout - incorrect
                    correct = false;
                }
            }
            
            // Track training trial results
            if (isInTrainingPhase) {
                trainingTrialResults.push(correct);
            }
            
            // Increment global trial number
            globalTrialNumber++;
            
            // Determine trial type
            const trialType = isInTrainingPhase ? 'training' : (trial.trialType || 'regular');
            
            // Record trial data - use leftStim and rightStim directly
            // Map block type to "less" (block type 2, B=target) or "more" (block type 1, A=target)
            const blockLabel = currentBlock.target === 'A' ? 'more' : 'less';
            
            const recordedTrialData = {
                trialNumber: globalTrialNumber,
                accuracy: correct,
                reactionTime: reactionTime,
                responseKey: responseKey, // 'A', 'L', or null
                target: currentBlock.target,
                noise: SIGMA,
                block: blockLabel,
                bigBlock: currentBigBlockIndex + 1,
                targetSide: currentTrialStimulusData ? currentTrialStimulusData.targetSide : null,
                trialType: trialType,
                isProbe: trial.isProbe || false,
                probeType: trial.probeType || null,
                showAxes: SHOW_AXES,
                leftStimSlope: currentTrialStimulusData ? currentTrialStimulusData.leftStim.slope : null,
                leftStimN: currentTrialStimulusData ? currentTrialStimulusData.leftStim.n : null,
                leftStimRSquared: currentTrialStimulusData ? currentTrialStimulusData.leftStim.rSquared : null,
                rightStimSlope: currentTrialStimulusData ? currentTrialStimulusData.rightStim.slope : null,
                rightStimN: currentTrialStimulusData ? currentTrialStimulusData.rightStim.n : null,
                rightStimRSquared: currentTrialStimulusData ? currentTrialStimulusData.rightStim.rSquared : null
            };
            
            // Store in trial data array
            trialData.push(recordedTrialData);
            console.log('Trial data:', recordedTrialData);
            
            // Show feedback (or white screen for probe trials)
            if (trial.isProbe) {
                // Probe trials: show white screen instead of feedback
                showWhiteScreen();
            } else {
                // Regular/training trials: show normal feedback
                showFeedback(correct);
            }
        }
        
        // Show feedback screen
        function showFeedback(correct) {
            const feedbackScreen = document.getElementById('feedbackScreen');
            feedbackScreen.className = 'feedback-screen ' + (correct ? 'correct' : 'incorrect');
            feedbackScreen.classList.remove('hidden');
            
            setTimeout(() => {
                feedbackScreen.classList.add('hidden');
                nextTrial();
            }, 500);
        }
        
        // Show white screen (for probe trials - no feedback)
        function showWhiteScreen() {
            const whiteScreen = document.getElementById('whiteScreen');
            whiteScreen.classList.remove('hidden');
            
            setTimeout(() => {
                whiteScreen.classList.add('hidden');
                nextTrial();
            }, 500);
        }
        
        // Move to next trial or end block
        function nextTrial() {
            if (isInTrainingPhase) {
                // We're in training phase
                currentTrialIndex++;
                
                if (currentTrialIndex < trainingTrials.length) {
                    // More training trials to present
                    presentTrial(trainingTrials[currentTrialIndex]);
                } else {
                    // Check training criterion: at least 60% accuracy
                    const totalTrainingTrials = trainingTrialResults.length;
                    const correctTrainingTrials = trainingTrialResults.filter(r => r === true).length;
                    const accuracy = totalTrainingTrials > 0 ? correctTrainingTrials / totalTrainingTrials : 0;
                    
                    console.log(`Training accuracy: ${(accuracy * 100).toFixed(1)}% (${correctTrainingTrials}/${totalTrainingTrials})`);
                    
                    if (accuracy >= 0.6) {
                        // Criterion met! Move to regular trials
                        console.log('Training criterion met! Moving to regular trials.');
                        isInTrainingPhase = false;
                        currentTrialIndex = 0;
                        
                        // Start first regular trial
                        if (trials.length > 0) {
                            presentTrial(trials[0]);
                        } else {
                            alert('Error: No regular trials generated');
                            showInstructionScreen('Error: No regular trials generated. Please refresh.');
                        }
                    } else {
                        // Criterion not met - add more training trials
                        console.log('Training criterion not met. Adding more training trials.');
                        const additionalTrials = generateTrainingTrials(8);
                        trainingTrials = trainingTrials.concat(additionalTrials);
                        // Continue with next training trial
                        presentTrial(trainingTrials[currentTrialIndex]);
                    }
                }
            } else {
                // We're in regular trial phase
                currentTrialIndex++;
                
                if (currentTrialIndex < trials.length) {
                    // Present next trial
                    presentTrial(trials[currentTrialIndex]);
                } else {
                    // Block complete
                    console.log('Block complete!');
                    currentBlockInBigBlock++;
                    
                    // Check if we've completed all 2 blocks in the big block
                    if (currentBlockInBigBlock >= 2) {
                        // Big block complete, move to next big block
                        currentBigBlockIndex++;
                        currentBlockInBigBlock = 0;
                        
                        if (currentBigBlockIndex >= BIG_BLOCKS.length) {
                            // All big blocks complete
                            exportTrialData();
                            showInstructionScreen('All blocks complete! Thank you for participating.\n\nData has been logged to console and downloaded as CSV.');
                        } else {
                            // Start next big block
                            startNextBigBlock();
                        }
                    } else {
                        // More blocks remaining in current big block
                        startNextBlockInBigBlock();
                    }
                }
            }
        }
        
        // Export trial data to CSV
        function exportTrialData() {
            // Log all data to console
            console.log('All trial data:', trialData);
            
            // Convert to CSV
            if (trialData.length === 0) {
                console.log('No trial data to export');
                return;
            }
            
            // Create CSV header
            const headers = ['trialNumber', 'accuracy', 'reactionTime', 'responseKey', 'target', 'noise', 'block', 'bigBlock', 'targetSide', 'trialType', 'isProbe', 'probeType', 'showAxes', 'leftStimSlope', 'leftStimN', 'leftStimRSquared', 'rightStimSlope', 'rightStimN', 'rightStimRSquared'];
            let csv = headers.join(',') + '\n';
            
            // Add data rows
            trialData.forEach(trial => {
                const row = [
                    trial.trialNumber,
                    trial.accuracy,
                    trial.reactionTime,
                    trial.responseKey !== null ? trial.responseKey : '',
                    trial.target,
                    trial.noise,
                    trial.block,
                    trial.bigBlock,
                    trial.targetSide !== null ? trial.targetSide : '',
                    trial.trialType || 'regular',
                    trial.isProbe ? 'true' : 'false',
                    trial.probeType !== null ? trial.probeType : '',
                    trial.showAxes ? 'true' : 'false',
                    trial.leftStimSlope !== null ? trial.leftStimSlope.toFixed(6) : '',
                    trial.leftStimN !== null ? trial.leftStimN : '',
                    trial.leftStimRSquared !== null ? trial.leftStimRSquared.toFixed(6) : '',
                    trial.rightStimSlope !== null ? trial.rightStimSlope.toFixed(6) : '',
                    trial.rightStimN !== null ? trial.rightStimN : '',
                    trial.rightStimRSquared !== null ? trial.rightStimRSquared.toFixed(6) : ''
                ];
                csv += row.join(',') + '\n';
            });
            
            // Download CSV file
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `forced_choice_data_${Date.now()}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }
        
        // Start next big block
        function startNextBigBlock() {
            // Set noise parameter for this big block
            SIGMA = BIG_BLOCKS[currentBigBlockIndex].sigma;
            
            // Initialize pattern for this big block
            initializeBigBlockPattern();
            
            // Reset block counter for new big block
            currentBlockInBigBlock = 0;
            
            // Start first block in this big block
            startNextBlockInBigBlock();
        }
        
        // Start next block within current big block
        function startNextBlockInBigBlock() {
            // Safety check
            if (!bigBlockPattern || bigBlockPattern.length === 0) {
                console.error('bigBlockPattern not initialized!');
                initializeBigBlockPattern();
            }
            
            // Set block type based on pattern
            const blockType = bigBlockPattern[currentBlockInBigBlock];
            console.log(`Starting block ${currentBlockInBigBlock + 1} of big block ${currentBigBlockIndex + 1}`);
            console.log(`  currentBlockInBigBlock:`, currentBlockInBigBlock);
            console.log(`  bigBlockPattern:`, bigBlockPattern);
            console.log(`  blockType from pattern:`, blockType);
            
            if (blockType === undefined || blockType === null) {
                console.error('Invalid blockType!', blockType);
                return;
            }
            
            setBlockType(blockType);
            console.log(`  After setBlockType, currentBlock.target:`, currentBlock.target);
            console.log(`  After setBlockType, currentBlock.distractor:`, currentBlock.distractor);
            
            // Clear trials array so new trials will be generated with correct block configuration
            trials = [];
            
            // Show instruction screen - use currentBlock.target to ensure correct display
            const targetText = currentBlock.target;
            const blockLabel = currentBlockInBigBlock === 0 ? 'less' : 'more';
            const blockInfo = `Big Block ${currentBigBlockIndex + 1} of ${BIG_BLOCKS.length} - Block: ${blockLabel}\nNoise: ${SIGMA.toFixed(3)} | Target: ${targetText}`;
            const instructionText = `Learn the Rule: press A if the target is on the left and press L if the target is on the right. A Green screen indicates you selected the correct side; a red screen indicates you selected the wrong side.`;
            showInstructionScreen(instructionText, blockInfo);
        }
        
        // Show instruction screen
        function showInstructionScreen(instructionText = 'Instructions will appear here', blockInfo = '') {
            const instructionScreen = document.getElementById('instructionScreen');
            const instructionTextEl = document.getElementById('instructionText');
            const blockInfoEl = document.getElementById('blockInfo');
            instructionTextEl.textContent = instructionText;
            blockInfoEl.textContent = blockInfo;
            instructionScreen.classList.remove('hidden');
            
            currentTrialIndex = 0;
            // Don't generate trials here - they'll be generated when startBlock is called
        }
        
        // Start block (called from start button)
        function startBlock() {
            const instructionScreen = document.getElementById('instructionScreen');
            instructionScreen.classList.add('hidden');
            
            // Initialize training phase
            isInTrainingPhase = true;
            trainingTrials = [];
            trainingTrialResults = [];
            currentTrialIndex = 0;
            
            // Generate regular trials (will be used after training)
            if (trials.length === 0) {
                generateTrials();
            }
            
            // Generate initial 8 training trials
            trainingTrials = generateTrainingTrials(8);
            
            // Show white screen for 500ms
            const whiteScreen = document.getElementById('whiteScreen');
            whiteScreen.classList.remove('hidden');
            
            setTimeout(() => {
                whiteScreen.classList.add('hidden');
                // Start first training trial
                if (trainingTrials.length > 0) {
                    presentTrial(trainingTrials[0]);
                } else {
                    alert('Error: No training trials generated');
                    showInstructionScreen('Error: No training trials generated. Please refresh.');
                }
            }, 500);
        }
        
        // Keyboard event handler - A for left, L for right
        document.addEventListener('keydown', function(event) {
            if (isWaitingForResponse) {
                if (event.code === 'KeyA') {
                    event.preventDefault();
                    handleTrialResponse('A');
                } else if (event.code === 'KeyL') {
                    event.preventDefault();
                    handleTrialResponse('L');
                }
            }
        });
        
        // Start button handler
        document.getElementById('startButton').addEventListener('click', startBlock);
        
        // Initialize - start first big block
        currentBigBlockIndex = 0;
        currentBlockInBigBlock = 0;
        startNextBigBlock();
    </script>
</body>
</html>
