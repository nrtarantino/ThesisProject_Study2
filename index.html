<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorization Task</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        
        #container {
            text-align: center;
            position: relative;
        }
        
        #trialDisplay {
            display: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        
        #trialDisplay img {
            position: absolute;
            left: 0;
            width: 100vw;
            height: 50vh;
            object-fit: contain;
        }
        
        #topImage {
            top: 0;
        }
        
        #bottomImage {
            top: 50vh;
        }
        
        #instructions {
            max-width: 800px;
            padding: 20px;
            font-size: 18px;
            line-height: 1.6;
        }
        
        .button {
            margin: 20px auto 0;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            display: block;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="instructions">
            <p id="instructionText">Loading...</p>
            <button id="startButton" class="button" style="display: none;">Start</button>
        </div>
        
        <div id="trialDisplay">
            <img id="topImage" alt="Top">
            <img id="bottomImage" alt="Bottom">
        </div>
    </div>

    <script>
        const QUALTRICS_ORIGIN = 'https://uwmadison.co1.qualtrics.com';

        const urlParams = new URLSearchParams(window.location.search);
        const C = parseInt(urlParams.get('C')) || null;
        const sonaId = urlParams.get('id') || '';
        const qualtricsResponseId = urlParams.get('ResponseID') || '';
        
        let responseCode, blockOrder, participantCondition;
        
        if (C !== null && C >= 1 && C <= 4) {
            responseCode = (C === 1 || C === 2) ? 1 : 2;
            blockOrder = (C === 1 || C === 3) ? 1 : 2;
        } else {
            responseCode = Math.random() < 0.5 ? 1 : 2;
            blockOrder = Math.random() < 0.5 ? 1 : 2;
        }
        participantCondition = responseCode;
        
        // Key mappings: condition determines which key maps to which category
        const KEY_MAPPING = {
            condition1: { 'Trend_Up': 'L', 'Trend_Down': 'A', 'Big': 'L', 'Small': 'A' },
            condition2: { 'Trend_Up': 'A', 'Trend_Down': 'L', 'Big': 'A', 'Small': 'L' }
        };
        
        function getCorrectKey(trial) {
            const condition = participantCondition === 1 ? 'condition1' : 'condition2';
            const block = BLOCKS[currentBlock];
            const category = block.categoryField === 'trend_category' ? trial.trend_category : trial.size_category;
            return KEY_MAPPING[condition][category];
        }
        
        const NEUTRAL_PATH = 'stimuli/neutral/neutral_0007.png';
        
        let manifest = [];
        let currentBlock = 0;
        let currentPhase = 'instructions';
        let currentTrialIndex = 0;
        let trialsPool = [];
        let trialStartTime = 0;
        let trialData = [];
        let globalTrialNumber = 0;
        let isIntertrialInterval = false;
        let currentPart = 1;
        let resumeAfterBreak = false;
        
        const BLOCKS_ORIGINAL = [
            { name: 'Trend', categoryField: 'trend_category' },
            { name: 'Big/Small', categoryField: 'size_category' }
        ];
        
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        
        let BLOCKS;
        if (blockOrder === 1) {
            BLOCKS = [...BLOCKS_ORIGINAL];
        } else {
            BLOCKS = [BLOCKS_ORIGINAL[1], BLOCKS_ORIGINAL[0]];
        }
        
        // Split manifest into two halves for each block
        let blockPools = [];
        
        async function loadManifest() {
            try {
                const response = await fetch('stimuli/manifest.csv');
                const text = await response.text();
                const lines = text.split('\n');
                const headers = lines[0].split(',');
                
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') continue;
                    const values = parseCSVLine(lines[i]);
                    if (values.length < headers.length) continue;
                    
                    const entry = {};
                    headers.forEach((header, idx) => {
                        entry[header.trim()] = values[idx] ? values[idx].trim() : '';
                    });
                    
                    entry.index = parseInt(entry.index);
                    entry.slope = parseFloat(entry.slope);
                    entry.n = parseInt(entry.n);
                    entry.sigma = parseFloat(entry.sigma);
                    entry.version = parseInt(entry.version);
                    
                    manifest.push(entry);
                }
                
                // Preload all images including neutral
                manifest.forEach(entry => {
                    const img = new Image();
                    img.src = `stimuli/${entry.path}`;
                });
                const neutralPreload = new Image();
                neutralPreload.src = NEUTRAL_PATH;
                
                // Shuffle and split into two equal pools of 256
                const shuffled = shuffleArray(manifest);
                const half = Math.floor(shuffled.length / 2);
                blockPools = [shuffled.slice(0, half), shuffled.slice(half)];
                
                showPartScreen();
            } catch (error) {
                document.getElementById('instructionText').textContent = 'Error loading stimuli.';
            }
        }
        
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result;
        }
        
        function getBlockInstructions() {
            const block = BLOCKS[currentBlock];
            const cond = participantCondition === 1 ? 'condition1' : 'condition2';
            
            if (block.categoryField === 'trend_category') {
                const increasingKey = KEY_MAPPING[cond]['Trend_Up'];
                const decreasingKey = KEY_MAPPING[cond]['Trend_Down'];
                return `Use the A and L keys to indicate whether the trend of the dot array on the bottom is increasing or decreasing compared to the trend of the dot array on the top. If the dot array on the bottom is increasing compared to the array on the top press the ${increasingKey} key. If the dot array on the bottom is decreasing compared to the array on the top press the ${decreasingKey} key.`;
            } else {
                const moreKey = KEY_MAPPING[cond]['Big'];
                const fewerKey = KEY_MAPPING[cond]['Small'];
                return `Use the A and L keys to indicate whether the dot array on the bottom has more or fewer dots than the array on the top. If the dot array on the bottom has more dots than the array on the top press the ${moreKey} key. If the dot array on the bottom has fewer dots than the array on the top press the ${fewerKey} key.`;
            }
        }
        
        function showPartScreen() {
            document.getElementById('instructionText').innerHTML = `
                <p>Part ${currentPart} of 4</p>
                <p>${getBlockInstructions()}</p>
            `;
            document.getElementById('instructions').style.display = 'block';
            document.getElementById('startButton').style.display = 'block';
            currentPhase = 'instructions';
        }
        
        function startBlock() {
            trialsPool = [...blockPools[currentBlock]];
            currentTrialIndex = 0;
            currentPhase = 'main';
            document.getElementById('instructions').style.display = 'none';
            document.getElementById('startButton').style.display = 'none';
            presentTrial();
        }
        
        function presentTrial() {
            if (trialsPool.length === 0) {
                currentBlock++;
                if (currentBlock >= BLOCKS.length) {
                    showCompletion();
                    return;
                }
                currentPart++;
                document.getElementById('trialDisplay').style.display = 'none';
                showPartScreen();
                return;
            }
            
            const randomIdx = Math.floor(Math.random() * trialsPool.length);
            const trial = trialsPool[randomIdx];
            trialsPool.splice(randomIdx, 1);
            
            window.currentTrial = trial;
            
            document.getElementById('topImage').src = NEUTRAL_PATH;
            document.getElementById('bottomImage').src = `stimuli/${trial.path}`;
            const stimImg = document.getElementById('bottomImage');
            document.getElementById('trialDisplay').style.display = 'block';
            
            trialStartTime = Date.now();
            stimImg.onload = () => { trialStartTime = Date.now(); };
            if (stimImg.complete) { trialStartTime = Date.now(); }
        }
        
        function showBreak() {
            currentPart++;
            resumeAfterBreak = true;
            document.getElementById('trialDisplay').style.display = 'none';
            showPartScreen();
        }
        
        function showCompletion() {
            document.getElementById('trialDisplay').style.display = 'none';
            document.getElementById('instructions').style.display = 'block';
            document.getElementById('instructionText').textContent = 'Task complete. Thank you for participating.';
            document.getElementById('startButton').style.display = 'none';
            exportTrialData();
        }
        
        function exportTrialData() {
            if (trialData.length === 0) return;
            
            const headers = ['sonaId','qualtricsResponseId','trialNumber','stimulusIndex','n','slope','noise','responseCode','blockOrder','accuracy','reactionTime','blockName'];
            let csv = headers.join(',') + '\n';
            
            trialData.forEach(t => {
                csv += [
                    sonaId,
                    qualtricsResponseId,
                    t.trialNumber,
                    t.stimulusIndex,
                    t.n,
                    t.slope !== null ? t.slope.toFixed(6) : '',
                    t.noise,
                    t.responseCode,
                    t.blockOrder,
                    t.accuracy,
                    t.reactionTime,
                    t.blockName
                ].join(',') + '\n';
            });
            
            const filename = `study2_${qualtricsResponseId || sonaId || Date.now()}.csv`;
            
            fetch("https://pipe.jspsych.org/api/data/", {
                method: "POST",
                headers: { "Content-Type": "application/json", Accept: "*/*" },
                body: JSON.stringify({
                    experimentID: "1IQX1jXTAEW6",
                    filename: filename,
                    data: csv,
                }),
            })
            .then(() => { finishAndReturn(); })
            .catch(() => { finishAndReturn(); });
        }
        
        function finishAndReturn() {
            function sendDone() {
                try {
                    if (window.opener && !window.opener.closed) {
                        window.opener.postMessage('{"type":"TASK_DONE"}', QUALTRICS_ORIGIN);
                        window.opener.postMessage({ type: 'TASK_DONE' }, QUALTRICS_ORIGIN);
                        return true;
                    }
                } catch (e) {}
                return false;
            }
            sendDone();
            setTimeout(sendDone, 75);
            setTimeout(sendDone, 200);
            setTimeout(function() {
                window.close();
                setTimeout(function() {
                    document.getElementById('instructionText').textContent = 'Task complete. Please return to your Qualtrics tab to continue.';
                }, 150);
            }, 150);
        }
        
        document.addEventListener('keydown', (e) => {
            if (currentPhase === 'instructions' || isIntertrialInterval) return;
            
            const key = e.key.toUpperCase();
            if (key === 'A' || key === 'L') {
                handleResponse(key);
            }
        });
        
        function handleResponse(key) {
            if (currentPhase !== 'main') return;
            
            if (trialStartTime === 0) trialStartTime = Date.now();
            const reactionTime = Date.now() - trialStartTime;
            
            const trial = window.currentTrial;
            if (!trial) return;
            
            const correctKey = getCorrectKey(trial);
            const correct = key === correctKey;
            
            globalTrialNumber++;
            trialData.push({
                trialNumber: globalTrialNumber,
                stimulusIndex: trial.index,
                n: trial.n,
                slope: trial.slope,
                noise: trial.sigma,
                responseCode: responseCode,
                blockOrder: blockOrder,
                accuracy: correct,
                reactionTime: reactionTime,
                blockName: BLOCKS[currentBlock].name
            });
            
            // Hide both images, 500ms blank ITI
            document.getElementById('trialDisplay').style.display = 'none';
            isIntertrialInterval = true;
            
            currentTrialIndex++;
            const breakAfterTrial = Math.floor(blockPools[currentBlock] ? blockPools[currentBlock].length / 2 : 128);
            
            if (currentTrialIndex === breakAfterTrial) {
                setTimeout(() => {
                    isIntertrialInterval = false;
                    showBreak();
                }, 500);
                return;
            }
            
            setTimeout(() => {
                isIntertrialInterval = false;
                presentTrial();
            }, 500);
        }
        
        document.getElementById('startButton').addEventListener('click', () => {
            if (resumeAfterBreak) {
                resumeAfterBreak = false;
                currentPhase = 'main';
                document.getElementById('instructions').style.display = 'none';
                document.getElementById('startButton').style.display = 'none';
                presentTrial();
            } else {
                startBlock();
            }
        });
        
        loadManifest();
    </script>
</body>
</html>
