<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorization Task (Local)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        
        #container {
            text-align: center;
            position: relative;
        }
        
        #trialDisplay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        
        #trialDisplay img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .button {
            margin: 20px auto 0;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            display: block;
        }
        
        #feedbackSquare {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            z-index: 25;
        }
    </style>
</head>
<body>
    <!-- Run locally: python -m http.server 8000 then open http://localhost:8000/index2.html -->
    <div id="container">
        <div id="instructions">
            <p id="instructionText"></p>
            <button id="startButton" class="button" style="display: none;">Start</button>
        </div>
        
        <div id="trialDisplay">
            <img id="stimulusImage" alt="Stimulus">
        </div>
        <div id="feedbackSquare"></div>
    </div>

    <script>
        const STIMULI_BASE = 'stimuli2';
        const QUALTRICS_ORIGIN = 'https://uwmadison.co1.qualtrics.com';

        const urlParams = new URLSearchParams(window.location.search);
        const C = parseInt(urlParams.get('C')) || null;
        const sonaId = urlParams.get('id') || urlParams.get('sonaId') || '';
        const qualtricsResponseId = urlParams.get('ResponseID') || urlParams.get('qualtricsResponseId') || '';
        
        let responseCode, stimulusPairing, participantCondition;
        
        // Conditions from C: responseCode (key mapping), stimulusPairing (training stimuli)
        if (C !== null && C >= 1 && C <= 4) {
            responseCode = (C === 1 || C === 2) ? 1 : 2;
            stimulusPairing = (C === 1 || C === 3) ? 1 : 2;  // 1 = equal (1-1,2-2...), 2 = opposite (1-8,2-7...)
        } else {
            responseCode = Math.random() < 0.5 ? 1 : 2;
            stimulusPairing = Math.random() < 0.5 ? 1 : 2;
        }
        participantCondition = responseCode;
        
        // Key mappings: condition determines which key maps to which category
        const KEY_MAPPING = {
            condition1: { 'Trend_Up': 'Q', 'Trend_Down': 'P', 'Big': 'Q', 'Small': 'P' },
            condition2: { 'Trend_Up': 'P', 'Trend_Down': 'Q', 'Big': 'P', 'Small': 'Q' }
        };
        
        function getCorrectKey(trial) {
            const condition = participantCondition === 1 ? 'condition1' : 'condition2';
            const block = BLOCKS[currentBlock];
            const category = block.categoryField === 'trend_category' ? trial.trend_category : trial.size_category;
            return KEY_MAPPING[condition][category];
        }
        
        let manifest = [];
        let participantPool = [];  // 256 stimuli (64 types × 4 exemplars)
        let trainingPool = [];    // 32 condition-specific (equal or opposite)
        let mainPool = [];        // 224 = 256 minus training
        let currentBlock = 0;
        let currentPhase = 'instructions';
        let currentTrialIndex = 0;
        let trialsPool = [];
        let isTrainingPhase = false;
        let trialStartTime = 0;
        let trialData = [];
        let globalTrialNumber = 0;
        let isIntertrialInterval = false;
        let currentPart = 1;
        let recentResponses = [];
        let stimulusHideTimeout = null;
        
        // index2: single task, always score by number
        const BLOCKS = [{ name: 'Number', categoryField: 'size_category' }];
        
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        
        // Manifest index structure: slope_idx*64 + n_idx*8 + version.
        // Equal-level = slope_idx === n_idx (negative trend with few dots).
        // Opposite-level = slope_idx === 7 - n_idx (level 1↔8, 2↔7, 3↔6, 4↔5).
        function getEqualLevelType(index) {
            const slopeIdx = Math.floor(index / 64);
            const nIdx = Math.floor((index % 64) / 8);
            return slopeIdx === nIdx ? slopeIdx : -1;
        }
        function getOppositeLevelType(index) {
            const slopeIdx = Math.floor(index / 64);
            const nIdx = Math.floor((index % 64) / 8);
            return slopeIdx === (7 - nIdx) ? slopeIdx : -1;
        }
        
        async function loadManifest() {
            try {
                const response = await fetch(STIMULI_BASE + '/manifest.csv', { cache: 'no-store' });
                const text = await response.text();
                const lines = text.split('\n');
                const headers = lines[0].split(',');
                
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') continue;
                    const values = parseCSVLine(lines[i]);
                    if (values.length < headers.length) continue;
                    
                    const entry = {};
                    headers.forEach((header, idx) => {
                        entry[header.trim()] = values[idx] ? values[idx].trim() : '';
                    });
                    
                    entry.index = parseInt(entry.index);
                    entry.slope = parseFloat(entry.slope);
                    entry.n = parseInt(entry.n);
                    entry.sigma = parseFloat(entry.sigma || 0.15);
                    if (entry.version !== undefined) entry.version = parseInt(entry.version);
                    
                    manifest.push(entry);
                }
                
                // Base: 64 types × 4 exemplars = 256 stimuli (same for everyone)
                participantPool = manifest.filter(entry => (entry.index % 8) < 4);
                // Training: condition-specific 32 (equal-level 1-1,2-2... or opposite 1-8,2-7...). Main: remaining 224.
                trainingPool = stimulusPairing === 1
                    ? participantPool.filter(entry => getEqualLevelType(entry.index) >= 0)
                    : participantPool.filter(entry => getOppositeLevelType(entry.index) >= 0);
                const trainingIndices = new Set(trainingPool.map(e => e.index));
                mainPool = participantPool.filter(entry => !trainingIndices.has(entry.index));
                
                // Preload all 256 and wait before enabling Start
                document.getElementById('instructionText').textContent = 'Loading stimuli...';
                await Promise.all(participantPool.map(entry => {
                    return new Promise((resolve, reject) => {
                        const img = new Image();
                        img.onload = resolve;
                        img.onerror = resolve; // proceed even if one fails
                        img.src = `${STIMULI_BASE}/${entry.path || entry.filename}`;
                    });
                }));
                
                document.getElementById('instructionText').textContent = 'You will see a series of dot arrays. Your task is to sort each array into one of two groups by pressing the P or the Q key. At first, you will receive feedback to help you learn the correct grouping. Try to learn the rule. Later, the feedback will stop, but please continue sorting the arrays in the same way. This task will take around 5 minutes.';
                document.getElementById('startButton').style.display = 'block';
            } catch (error) {
                document.getElementById('instructionText').textContent = 'Error loading. Run: python -m http.server 8000';
            }
        }
        
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result;
        }
        
        function getTaskName() {
            const block = BLOCKS[currentBlock];
            return block.categoryField === 'trend_category' ? 'Trend Judgement Task' : 'Number Task';
        }
        
        function hideReminderText() {}
        
        function getReminderText() {
            const block = BLOCKS[currentBlock];
            const cond = participantCondition === 1 ? 'condition1' : 'condition2';
            if (block.categoryField === 'trend_category') {
                const increasingKey = KEY_MAPPING[cond]['Trend_Up'];
                const decreasingKey = KEY_MAPPING[cond]['Trend_Down'];
                return `Compared to the array above, did the array that just disappeared have an:<br><br><span class="reminderOption"><strong>Increasing</strong> trend? <strong>Press ${increasingKey}</strong></span><br><br><span class="reminderOption"><strong>Decreasing</strong> trend? <strong>Press ${decreasingKey}</strong></span>`;
            } else {
                const moreKey = KEY_MAPPING[cond]['Big'];
                const fewerKey = KEY_MAPPING[cond]['Small'];
                return `Compared to the array above, did the array that just disappeared have:<br><br><span class="reminderOption"><strong>More</strong> dots? <strong>Press ${moreKey}</strong></span><br><br><span class="reminderOption"><strong>Fewer</strong> dots? <strong>Press ${fewerKey}</strong></span>`;
            }
        }
        
        function getBlockInstructions(justAsBefore) {
            const block = BLOCKS[currentBlock];
            const cond = participantCondition === 1 ? 'condition1' : 'condition2';
            if (block.categoryField === 'trend_category') {
                const increasingKey = KEY_MAPPING[cond]['Trend_Up'];
                const decreasingKey = KEY_MAPPING[cond]['Trend_Down'];
                const rest = `If the bottom dot array's trend is increasing compared to the array on top press ${increasingKey}; if it is decreasing press ${decreasingKey}.`;
                return justAsBefore ? `Just as in the part before, ${rest.charAt(0).toLowerCase()}${rest.slice(1)}` : rest;
            } else {
                const moreKey = KEY_MAPPING[cond]['Big'];
                const fewerKey = KEY_MAPPING[cond]['Small'];
                const rest = `If the bottom dot array has more dots than the array on top press ${moreKey}; if it has fewer press ${fewerKey}.`;
                return justAsBefore ? `Just as in the part before, ${rest.charAt(0).toLowerCase()}${rest.slice(1)}` : rest;
            }
        }
        
        function showReminder() {
            resumeAfterReminder = true;
            document.getElementById('trialDisplay').style.display = 'none';
            document.getElementById('overviewScreen').style.display = 'none';
            document.getElementById('overviewRedSquare').style.display = 'none';
            document.getElementById('overviewGreenSquare').style.display = 'none';
            hideReminderText();
            document.getElementById('neutralDisplay').style.display = 'none';
            document.getElementById('instructionText').innerHTML = `
                <p>Remember</p>
                <p>${getBlockInstructions(false)}</p>
            `;
            document.getElementById('instructions').style.display = 'block';
            document.getElementById('startButton').style.display = 'block';
            document.getElementById('centerLine').style.display = 'none';
            currentPhase = 'instructions';
        }
        
        function getOverviewText() {
            const block = BLOCKS[currentBlock];
            const isFirstTask = currentBlock === 0;
            const breakNote = ' There will be breaks throughout this task. The task will take 5-7 minutes.';
            if (block.categoryField === 'trend_category') {
                return `In this study you will be judging the trend of dots in an array. A dot array will appear in the bottom of the screen where the green square is for a short time and you will use the P and Q keys to indicate if it has an increasing or decreasing trend compared to the dot array that will be displayed above it where the red square is.${breakNote}`;
            } else {
                return `In this study you will be judging the number of dots in an array. A dot array will appear in the bottom of the screen where the green square is for a short time and you will use the P and Q keys to indicate if it has more or fewer dots compared to the dot array that will be displayed above it where the red square is.${breakNote}`;
            }
        }
        
        function showOverviewScreen() {
            document.getElementById('overviewTaskTitle').textContent = getTaskName();
            document.getElementById('overviewText').textContent = getOverviewText();
            document.getElementById('overviewScreen').style.display = 'flex';
            document.getElementById('overviewRedSquare').style.display = 'block';
            document.getElementById('overviewGreenSquare').style.display = 'block';
            document.getElementById('instructions').style.display = 'none';
            document.getElementById('startButton').style.display = 'none';
            document.getElementById('continueButton').style.display = 'block';
            currentPhase = 'overview';
        }
        
        function showPartScreen() {
            document.getElementById('overviewScreen').style.display = 'none';
            document.getElementById('overviewRedSquare').style.display = 'none';
            document.getElementById('overviewGreenSquare').style.display = 'none';
            document.getElementById('continueButton').style.display = 'none';
            const partNum = currentPart;
            const isAfterBreak = (currentPart > 1);
            const instrText = getBlockInstructions(isAfterBreak);
            const breakContent = isAfterBreak ? `
                <p class="breakTitle">Break</p>
                <p>Feel free to take a break. Part ${partNum} of 4 is the same as the last.</p>
            ` : '';
            document.getElementById('instructionText').innerHTML = `
                ${breakContent}
                <p>Part ${partNum} of 4</p>
                <p>${instrText}</p>
            `;
            document.getElementById('instructions').style.display = 'block';
            document.getElementById('startButton').style.display = 'block';
            document.getElementById('centerLine').style.display = 'none';
            document.getElementById('neutralDisplay').style.display = 'none';
            currentPhase = 'instructions';
        }
        
        function startBlock() {
            trialsPool = shuffleArray([...trainingPool]);
            isTrainingPhase = true;
            currentTrialIndex = 0;
            recentResponses = [];
            currentPhase = 'main';
            document.getElementById('instructions').style.display = 'none';
            document.getElementById('startButton').style.display = 'none';
            presentTrial();
        }
        
        function presentTrial(itiDelayMs) {
            if (stimulusHideTimeout) {
                clearTimeout(stimulusHideTimeout);
                stimulusHideTimeout = null;
            }
            hideReminderText();
            document.getElementById('feedbackSquare').style.display = 'none';
            if (trialsPool.length === 0) {
                if (isTrainingPhase) {
                    isTrainingPhase = false;
                    trialsPool = shuffleArray([...mainPool]);
                    currentTrialIndex = 0;
                    recentResponses = [];
                    setTimeout(() => presentTrial(0), 500);  // 0 ITI after training→main transition
                    return;
                }
                setTimeout(() => {
                    currentBlock++;
                    if (currentBlock >= BLOCKS.length) {
                        showCompletion();
                        return;
                    }
                }, 500);
                return;
            }
            
            const randomIdx = Math.floor(Math.random() * trialsPool.length);
            const trial = trialsPool[randomIdx];
            trialsPool.splice(randomIdx, 1);
            
            window.currentTrial = trial;
            
            const trialPath = trial.path || trial.filename;
            const stimulusImg = document.getElementById('stimulusImage');
            stimulusImg.src = `${STIMULI_BASE}/${trialPath}`;
            
            let imgReady = false;
            let minDelayElapsed = !itiDelayMs || itiDelayMs <= 0;
            let stimulusShown = false;
            const STIMULUS_DURATION_MS = 1500;
            function showWhenReady() {
                if (imgReady && minDelayElapsed && !stimulusShown) {
                    stimulusShown = true;
                    document.getElementById('trialDisplay').style.display = 'block';
                    trialStartTime = Date.now();
                    isIntertrialInterval = false;
                    stimulusHideTimeout = setTimeout(() => {
                        stimulusHideTimeout = null;
                        document.getElementById('trialDisplay').style.display = 'none';
                    }, STIMULUS_DURATION_MS);
                }
            }
            stimulusImg.onload = () => { imgReady = true; showWhenReady(); };
            if (stimulusImg.complete) { imgReady = true; showWhenReady(); }
            
            if (itiDelayMs && itiDelayMs > 0) {
                setTimeout(() => {
                    minDelayElapsed = true;
                    showWhenReady();
                }, itiDelayMs);
            }
        }
        
        function showCompletion() {
            document.getElementById('trialDisplay').style.display = 'none';
            document.getElementById('feedbackSquare').style.display = 'none';
            hideReminderText();
            document.getElementById('instructions').style.display = 'block';
            document.getElementById('instructionText').textContent = 'Task complete. Thank you for participating.';
            document.getElementById('startButton').style.display = 'none';
            exportTrialData();
        }
        
        let hasExported = false;
        function exportTrialData() {
            if (trialData.length === 0 || hasExported) return;
            hasExported = true;
            
            const headers = ['sonaId','qualtricsResponseId','trialNumber','stimulusIndex','n','slope','noise','responseCode','stimulusPairing','accuracy','reactionTime','responseKey','trialType'];
            let csv = headers.join(',') + '\n';
            
            trialData.forEach(t => {
                csv += [
                    sonaId,
                    qualtricsResponseId,
                    t.trialNumber,
                    t.stimulusIndex,
                    t.n,
                    t.slope !== null ? t.slope.toFixed(6) : '',
                    t.noise,
                    t.responseCode,
                    t.stimulusPairing,
                    t.accuracy,
                    t.reactionTime,
                    t.responseKey,
                    t.trialType || 'main'
                ].join(',') + '\n';
            });
            
            const filename = `study2d_${qualtricsResponseId || sonaId || Date.now()}_rc${responseCode}_pairing${stimulusPairing}.csv`;
            
            fetch("https://pipe.jspsych.org/api/data/", {
                method: "POST",
                headers: { "Content-Type": "application/json", Accept: "*/*" },
                body: JSON.stringify({
                    experimentID: "1IQX1jXTAEW6",
                    filename: filename,
                    data: csv,
                }),
            })
            .then(() => { finishAndReturn(); })
            .catch(() => { finishAndReturn(); });
        }
        
        function finishAndReturn() {
            function sendDone() {
                try {
                    if (window.opener && !window.opener.closed) {
                        window.opener.postMessage('{"type":"TASK_DONE"}', QUALTRICS_ORIGIN);
                        window.opener.postMessage({ type: 'TASK_DONE' }, QUALTRICS_ORIGIN);
                        return true;
                    }
                } catch (e) {}
                return false;
            }
            sendDone();
            setTimeout(sendDone, 75);
            setTimeout(sendDone, 200);
            setTimeout(function() {
                window.close();
                setTimeout(function() {
                    document.getElementById('instructionText').textContent = 'Task complete. Thank you for participating.';
                }, 150);
            }, 150);
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            if (currentPhase === 'instructions' || isIntertrialInterval) return;
            
            const key = e.key.toUpperCase();
            if (key === 'P' || key === 'Q') {
                handleResponse(key);
            }
        });
        
        function handleResponse(key) {
            if (currentPhase !== 'main') return;
            
            if (trialStartTime === 0) trialStartTime = Date.now();
            const reactionTime = Date.now() - trialStartTime;
            
            const trial = window.currentTrial;
            if (!trial) return;
            
            const correctKey = getCorrectKey(trial);
            const correct = key === correctKey;
            
            globalTrialNumber++;
            trialData.push({
                trialNumber: globalTrialNumber,
                stimulusIndex: trial.index,
                n: trial.n,
                slope: trial.slope,
                noise: trial.sigma,
                responseCode: responseCode,
                stimulusPairing: stimulusPairing,
                accuracy: correct,
                reactionTime: reactionTime,
                responseKey: key,
                trialType: isTrainingPhase ? 'training' : 'main'
            });
            
            recentResponses.push(correct);
            
            if (stimulusHideTimeout) {
                clearTimeout(stimulusHideTimeout);
                stimulusHideTimeout = null;
            }
            hideReminderText();
            document.getElementById('trialDisplay').style.display = 'none';
            isIntertrialInterval = true;
            
            currentTrialIndex++;

            if (isTrainingPhase) {
                const fb = document.getElementById('feedbackSquare');
                fb.style.display = 'block';
                fb.style.backgroundColor = correct ? '#0a0' : '#c00';
                const delayMs = correct ? 500 : 750;  // longer for incorrect
                setTimeout(() => {
                    fb.style.display = 'none';
                    presentTrial(0);  // 0 ITI: stimulus appears immediately (preloaded)
                }, delayMs);
                return;
            }
            
            presentTrial(500);  // 500ms ITI between main trials
        }
        
        document.getElementById('startButton').addEventListener('click', () => {
            startBlock();
        });
        
        loadManifest();
    </script>
</body>
</html>
