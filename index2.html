<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorization Task (Local)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        
        #container {
            text-align: center;
            position: relative;
        }
        
        #neutralDisplay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 50vh;
        }
        
        #neutralDisplay img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        #trialDisplay {
            display: none;
            position: fixed;
            top: 50vh;
            left: 0;
            width: 100vw;
            height: 50vh;
        }
        
        #trialDisplay img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        #reminderText {
            display: none;
            position: fixed;
            top: 50vh;
            left: 0;
            width: 100vw;
            height: 50vh;
            padding: 20px;
            box-sizing: border-box;
            font-size: 18px;
            line-height: 1.6;
            text-align: center;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        #reminderText .reminderContent {
            max-width: min(1100px, 95vw);
            text-align: center;
            margin: 0 auto;
        }
        
        #reminderText .reminderOption {
            font-size: 1.35em;
        }
        
        #centerLine {
            display: none;
            position: fixed;
            left: 0;
            top: calc(50vh - 1px);
            width: 100%;
            height: 2px;
            background: white;
            pointer-events: none;
            z-index: 10;
        }
        
        #instructions {
            max-width: 800px;
            padding: 20px;
            font-size: 18px;
            line-height: 1.6;
        }
        
        #instructions .taskName {
            font-size: 24px;
        }
        
        .button {
            margin: 20px auto 0;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            display: block;
        }
        
        .breakTitle {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        #overviewScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            max-width: 800px;
            font-size: 18px;
            line-height: 1.6;
        }
        
        #overviewTaskTitle {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        #overviewRedSquare {
            display: none;
            position: fixed;
            left: 50%;
            top: 22vh;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background-color: #c00;
            z-index: 20;
        }
        
        #overviewGreenSquare {
            display: none;
            position: fixed;
            left: 50%;
            bottom: 22vh;
            transform: translate(-50%, 50%);
            width: 60px;
            height: 60px;
            background-color: #0a0;
            z-index: 20;
        }
    </style>
</head>
<body>
    <!-- Run locally: python -m http.server 8000 then open http://localhost:8000/index2.html -->
    <div id="container">
        <div id="instructions">
            <p id="instructionText">Loading...</p>
            <button id="startButton" class="button" style="display: none;">Start</button>
        </div>
        
        <div id="overviewScreen">
            <p id="overviewTaskTitle"></p>
            <p id="overviewText"></p>
            <div id="overviewRedSquare"></div>
            <div id="overviewGreenSquare"></div>
            <button id="continueButton" class="button">Continue</button>
        </div>
        
        <div id="centerLine"></div>
        <div id="neutralDisplay">
            <img id="topImage" alt="Neutral">
        </div>
        <div id="trialDisplay">
            <img id="bottomImage" alt="Stimulus">
        </div>
        <div id="reminderText"></div>
    </div>

    <script>
        const STIMULI_BASE = 'stimuli2';
        const NEUTRAL_PATH = STIMULI_BASE + '/neutral.png';

        const urlParams = new URLSearchParams(window.location.search);
        const C = parseInt(urlParams.get('C')) || null;
        const sonaId = urlParams.get('id') || urlParams.get('sonaId') || '';
        const qualtricsResponseId = urlParams.get('ResponseID') || urlParams.get('qualtricsResponseId') || '';
        
        let responseCode, blockOrder, participantCondition;
        
        // Block order = between-subjects condition: 1 = Trend only, 2 = Number only
        if (C !== null && C >= 1 && C <= 4) {
            responseCode = (C === 1 || C === 2) ? 1 : 2;
            blockOrder = (C === 1 || C === 3) ? 1 : 2;
        } else {
            responseCode = Math.random() < 0.5 ? 1 : 2;
            blockOrder = Math.random() < 0.5 ? 1 : 2;
        }
        blockOrder = 2;  // Force Number for now
        participantCondition = responseCode;
        
        // Key mappings: condition determines which key maps to which category
        const KEY_MAPPING = {
            condition1: { 'Trend_Up': 'Q', 'Trend_Down': 'P', 'Big': 'Q', 'Small': 'P' },
            condition2: { 'Trend_Up': 'P', 'Trend_Down': 'Q', 'Big': 'P', 'Small': 'Q' }
        };
        
        function getCorrectKey(trial) {
            const condition = participantCondition === 1 ? 'condition1' : 'condition2';
            const block = BLOCKS[currentBlock];
            const category = block.categoryField === 'trend_category' ? trial.trend_category : trial.size_category;
            return KEY_MAPPING[condition][category];
        }
        
        let manifest = [];
        let currentBlock = 0;
        let currentPhase = 'instructions';
        let currentTrialIndex = 0;
        let trialsPool = [];
        let trainingManifest = [];
        let isTrainingPhase = false;
        let trialStartTime = 0;
        let trialData = [];
        let globalTrialNumber = 0;
        let isIntertrialInterval = false;
        let currentPart = 1;
        let resumeAfterBreak = false;
        let resumeAfterReminder = false;
        let recentResponses = [];
        let stimulusHideTimeout = null;
        let reminderTextTimeout = null;
        
        // Between-subjects: blockOrder 1 = Trend only, 2 = Number only
        const BLOCKS = blockOrder === 1
            ? [{ name: 'Trend', categoryField: 'trend_category' }]
            : [{ name: 'Number', categoryField: 'size_category' }];
        
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        
        async function loadManifest() {
            try {
                const response = await fetch(STIMULI_BASE + '/manifest.csv', { cache: 'no-store' });
                const text = await response.text();
                const lines = text.split('\n');
                const headers = lines[0].split(',');
                
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') continue;
                    const values = parseCSVLine(lines[i]);
                    if (values.length < headers.length) continue;
                    
                    const entry = {};
                    headers.forEach((header, idx) => {
                        entry[header.trim()] = values[idx] ? values[idx].trim() : '';
                    });
                    
                    entry.index = parseInt(entry.index);
                    entry.slope = parseFloat(entry.slope);
                    entry.n = parseInt(entry.n);
                    entry.sigma = parseFloat(entry.sigma || 0.15);
                    if (entry.version !== undefined) entry.version = parseInt(entry.version);
                    
                    manifest.push(entry);
                }
                
                manifest.forEach(entry => {
                    const img = new Image();
                    img.src = `${STIMULI_BASE}/${entry.path || entry.filename}`;
                });
                
                try {
                    const trainResponse = await fetch(STIMULI_BASE + '/manifest_training.csv', { cache: 'no-store' });
                    if (trainResponse.ok) {
                        const trainText = await trainResponse.text();
                        const trainLines = trainText.split('\n');
                        const trainHeaders = trainLines[0].split(',');
                        for (let i = 1; i < trainLines.length; i++) {
                            if (trainLines[i].trim() === '') continue;
                            const values = parseCSVLine(trainLines[i]);
                            if (values.length < trainHeaders.length) continue;
                            const entry = {};
                            trainHeaders.forEach((header, idx) => {
                                entry[header.trim()] = values[idx] ? values[idx].trim() : '';
                            });
                            entry.index = parseInt(entry.index);
                            entry.slope = parseFloat(entry.slope);
                            entry.n = parseInt(entry.n);
                            entry.sigma = parseFloat(entry.sigma || 0.15);
                            trainingManifest.push(entry);
                        }
                        trainingManifest.forEach(entry => {
                            const img = new Image();
                            img.src = `${STIMULI_BASE}/${entry.path || entry.filename}`;
                        });
                    }
                } catch (e) {}
                
                const neutralPreload = new Image();
                neutralPreload.src = NEUTRAL_PATH;
                
                showOverviewScreen();
            } catch (error) {
                document.getElementById('instructionText').textContent = 'Error loading stimuli. Run with: python -m http.server 8000 then open http://localhost:8000/index2.html';
            }
        }
        
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result;
        }
        
        function getTaskName() {
            const block = BLOCKS[currentBlock];
            return block.categoryField === 'trend_category' ? 'Trend Judgement Task' : 'Number Task';
        }
        
        function hideReminderText() {
            if (reminderTextTimeout) {
                clearTimeout(reminderTextTimeout);
                reminderTextTimeout = null;
            }
            const el = document.getElementById('reminderText');
            el.style.display = 'none';
        }
        
        function getReminderText() {
            const block = BLOCKS[currentBlock];
            const cond = participantCondition === 1 ? 'condition1' : 'condition2';
            if (block.categoryField === 'trend_category') {
                const increasingKey = KEY_MAPPING[cond]['Trend_Up'];
                const decreasingKey = KEY_MAPPING[cond]['Trend_Down'];
                return `Compared to the array above, did the array that just disappeared have an:<br><br><span class="reminderOption"><strong>Increasing</strong> trend? <strong>Press ${increasingKey}</strong></span><br><br><span class="reminderOption"><strong>Decreasing</strong> trend? <strong>Press ${decreasingKey}</strong></span>`;
            } else {
                const moreKey = KEY_MAPPING[cond]['Big'];
                const fewerKey = KEY_MAPPING[cond]['Small'];
                return `Compared to the array above, did the array that just disappeared have:<br><br><span class="reminderOption"><strong>More</strong> dots? <strong>Press ${moreKey}</strong></span><br><br><span class="reminderOption"><strong>Fewer</strong> dots? <strong>Press ${fewerKey}</strong></span>`;
            }
        }
        
        function getBlockInstructions(justAsBefore) {
            const block = BLOCKS[currentBlock];
            const cond = participantCondition === 1 ? 'condition1' : 'condition2';
            if (block.categoryField === 'trend_category') {
                const increasingKey = KEY_MAPPING[cond]['Trend_Up'];
                const decreasingKey = KEY_MAPPING[cond]['Trend_Down'];
                const rest = `If the bottom dot array's trend is increasing compared to the array on top press ${increasingKey}; if it is decreasing press ${decreasingKey}.`;
                return justAsBefore ? `Just as in the part before, ${rest.charAt(0).toLowerCase()}${rest.slice(1)}` : rest;
            } else {
                const moreKey = KEY_MAPPING[cond]['Big'];
                const fewerKey = KEY_MAPPING[cond]['Small'];
                const rest = `If the bottom dot array has more dots than the array on top press ${moreKey}; if it has fewer press ${fewerKey}.`;
                return justAsBefore ? `Just as in the part before, ${rest.charAt(0).toLowerCase()}${rest.slice(1)}` : rest;
            }
        }
        
        function showReminder() {
            resumeAfterReminder = true;
            document.getElementById('trialDisplay').style.display = 'none';
            document.getElementById('overviewScreen').style.display = 'none';
            document.getElementById('overviewRedSquare').style.display = 'none';
            document.getElementById('overviewGreenSquare').style.display = 'none';
            hideReminderText();
            document.getElementById('neutralDisplay').style.display = 'none';
            document.getElementById('instructionText').innerHTML = `
                <p>Remember</p>
                <p>${getBlockInstructions(false)}</p>
            `;
            document.getElementById('instructions').style.display = 'block';
            document.getElementById('startButton').style.display = 'block';
            document.getElementById('centerLine').style.display = 'none';
            currentPhase = 'instructions';
        }
        
        function getOverviewText() {
            const block = BLOCKS[currentBlock];
            const isFirstTask = currentBlock === 0;
            const breakNote = ' There will be breaks throughout this task. The task will take 5-7 minutes.';
            if (block.categoryField === 'trend_category') {
                return `In this study you will be judging the trend of dots in an array. A dot array will appear in the bottom of the screen where the green square is for a short time and you will use the P and Q keys to indicate if it has an increasing or decreasing trend compared to the dot array that will be displayed above it where the red square is.${breakNote}`;
            } else {
                return `In this study you will be judging the number of dots in an array. A dot array will appear in the bottom of the screen where the green square is for a short time and you will use the P and Q keys to indicate if it has more or fewer dots compared to the dot array that will be displayed above it where the red square is.${breakNote}`;
            }
        }
        
        function showOverviewScreen() {
            document.getElementById('overviewTaskTitle').textContent = getTaskName();
            document.getElementById('overviewText').textContent = getOverviewText();
            document.getElementById('overviewScreen').style.display = 'flex';
            document.getElementById('overviewRedSquare').style.display = 'block';
            document.getElementById('overviewGreenSquare').style.display = 'block';
            document.getElementById('instructions').style.display = 'none';
            document.getElementById('startButton').style.display = 'none';
            document.getElementById('continueButton').style.display = 'block';
            currentPhase = 'overview';
        }
        
        function showPartScreen() {
            document.getElementById('overviewScreen').style.display = 'none';
            document.getElementById('overviewRedSquare').style.display = 'none';
            document.getElementById('overviewGreenSquare').style.display = 'none';
            document.getElementById('continueButton').style.display = 'none';
            const partNum = currentPart;
            const isAfterBreak = (currentPart > 1);
            const instrText = getBlockInstructions(isAfterBreak);
            const breakContent = isAfterBreak ? `
                <p class="breakTitle">Break</p>
                <p>Feel free to take a break. Part ${partNum} of 4 is the same as the last.</p>
            ` : '';
            document.getElementById('instructionText').innerHTML = `
                ${breakContent}
                <p>Part ${partNum} of 4</p>
                <p>${instrText}</p>
            `;
            document.getElementById('instructions').style.display = 'block';
            document.getElementById('startButton').style.display = 'block';
            document.getElementById('centerLine').style.display = 'none';
            document.getElementById('neutralDisplay').style.display = 'none';
            currentPhase = 'instructions';
        }
        
        document.getElementById('continueButton').addEventListener('click', () => {
            showPartScreen();
        });
        
        function startBlock() {
            if (trainingManifest.length >= 10) {
                const shuffled = shuffleArray([...trainingManifest]);
                trialsPool = shuffled.slice(0, 10);
                isTrainingPhase = true;
            } else {
                trialsPool = shuffleArray([...manifest]);
                isTrainingPhase = false;
            }
            currentTrialIndex = 0;
            recentResponses = [];
            currentPhase = 'main';
            document.getElementById('instructions').style.display = 'none';
            document.getElementById('startButton').style.display = 'none';
            document.getElementById('centerLine').style.display = 'block';
            document.getElementById('neutralDisplay').style.display = 'block';
            document.getElementById('topImage').src = NEUTRAL_PATH;
            presentTrial();
        }
        
        function presentTrial(itiDelayMs) {
            if (stimulusHideTimeout) {
                clearTimeout(stimulusHideTimeout);
                stimulusHideTimeout = null;
            }
            hideReminderText();
            if (trialsPool.length === 0) {
                if (isTrainingPhase) {
                    isTrainingPhase = false;
                    trialsPool = shuffleArray([...manifest]);
                    currentTrialIndex = 0;
                    recentResponses = [];
                    setTimeout(() => presentTrial(500), 500);
                    return;
                }
                setTimeout(() => {
                    currentBlock++;
                    if (currentBlock >= BLOCKS.length) {
                        showCompletion();
                        return;
                    }
                    currentPart++;
                    document.getElementById('trialDisplay').style.display = 'none';
                    hideReminderText();
                    showOverviewScreen();
                }, 500);
                return;
            }
            
            const randomIdx = Math.floor(Math.random() * trialsPool.length);
            const trial = trialsPool[randomIdx];
            trialsPool.splice(randomIdx, 1);
            
            window.currentTrial = trial;
            
            const trialPath = trial.path || trial.filename;
            document.getElementById('bottomImage').src = `${STIMULI_BASE}/${trialPath}`;
            const topImg = document.getElementById('topImage');
            const bottomImg = document.getElementById('bottomImage');
            
            let topReady = false, bottomReady = false;
            let minDelayElapsed = !itiDelayMs || itiDelayMs <= 0;
            let stimulusShown = false;
            const STIMULUS_DURATION_MS = 1500;
            function showWhenReady() {
                if (topReady && bottomReady && minDelayElapsed && !stimulusShown) {
                    stimulusShown = true;
                    document.getElementById('trialDisplay').style.display = 'block';
                    trialStartTime = Date.now();
                    isIntertrialInterval = false;
                    stimulusHideTimeout = setTimeout(() => {
                        stimulusHideTimeout = null;
                        document.getElementById('trialDisplay').style.display = 'none';
                        reminderTextTimeout = setTimeout(() => {
                            reminderTextTimeout = null;
                            document.getElementById('reminderText').innerHTML = '<div class="reminderContent">' + getReminderText() + '</div>';
                            document.getElementById('reminderText').style.display = 'flex';
                        }, 250);
                    }, STIMULUS_DURATION_MS);
                }
            }
            topImg.onload = () => { topReady = true; showWhenReady(); };
            bottomImg.onload = () => { bottomReady = true; showWhenReady(); };
            if (topImg.complete) { topReady = true; showWhenReady(); }
            if (bottomImg.complete) { bottomReady = true; showWhenReady(); }
            
            if (itiDelayMs && itiDelayMs > 0) {
                setTimeout(() => {
                    minDelayElapsed = true;
                    showWhenReady();
                }, itiDelayMs);
            }
        }
        
        function showBreak() {
            currentPart++;
            resumeAfterBreak = true;
            document.getElementById('trialDisplay').style.display = 'none';
            document.getElementById('overviewScreen').style.display = 'none';
            document.getElementById('overviewRedSquare').style.display = 'none';
            document.getElementById('overviewGreenSquare').style.display = 'none';
            hideReminderText();
            showPartScreen();
        }
        
        function showCompletion() {
            document.getElementById('trialDisplay').style.display = 'none';
            document.getElementById('overviewScreen').style.display = 'none';
            document.getElementById('overviewRedSquare').style.display = 'none';
            document.getElementById('overviewGreenSquare').style.display = 'none';
            hideReminderText();
            document.getElementById('neutralDisplay').style.display = 'none';
            document.getElementById('instructions').style.display = 'block';
            document.getElementById('centerLine').style.display = 'none';
            document.getElementById('instructionText').textContent = 'Task complete. Thank you for participating.';
            document.getElementById('startButton').style.display = 'none';
            exportTrialData();
        }
        
        let hasExported = false;
        function exportTrialData() {
            if (trialData.length === 0 || hasExported) return;
            hasExported = true;
            
            const headers = ['sonaId','qualtricsResponseId','trialNumber','stimulusIndex','n','slope','noise','responseCode','blockOrder','accuracy','reactionTime','blockName','responseKey','trialType'];
            let csv = headers.join(',') + '\n';
            
            trialData.forEach(t => {
                csv += [
                    sonaId,
                    qualtricsResponseId,
                    t.trialNumber,
                    t.stimulusIndex,
                    t.n,
                    t.slope !== null ? t.slope.toFixed(6) : '',
                    t.noise,
                    t.responseCode,
                    t.blockOrder,
                    t.accuracy,
                    t.reactionTime,
                    t.blockName,
                    t.responseKey,
                    t.trialType || 'main'
                ].join(',') + '\n';
            });
            
            const filename = `study2c_${qualtricsResponseId || sonaId || Date.now()}_block${blockOrder}.csv`;
            
            // Local mode: download CSV instead of posting to DataPipe
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            URL.revokeObjectURL(a.href);
            
            document.getElementById('instructionText').textContent = 'Task complete. Data saved as ' + filename;
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            if (currentPhase === 'instructions' || isIntertrialInterval) return;
            
            const key = e.key.toUpperCase();
            if (key === 'P' || key === 'Q') {
                handleResponse(key);
            }
        });
        
        function handleResponse(key) {
            if (currentPhase !== 'main') return;
            
            if (trialStartTime === 0) trialStartTime = Date.now();
            const reactionTime = Date.now() - trialStartTime;
            
            const trial = window.currentTrial;
            if (!trial) return;
            
            const correctKey = getCorrectKey(trial);
            const correct = key === correctKey;
            
            globalTrialNumber++;
            trialData.push({
                trialNumber: globalTrialNumber,
                stimulusIndex: trial.index,
                n: trial.n,
                slope: trial.slope,
                noise: trial.sigma,
                responseCode: responseCode,
                blockOrder: blockOrder,
                accuracy: correct,
                reactionTime: reactionTime,
                blockName: BLOCKS[currentBlock].name,
                responseKey: key,
                trialType: isTrainingPhase ? 'training' : 'main'
            });
            
            recentResponses.push(correct);
            
            if (stimulusHideTimeout) {
                clearTimeout(stimulusHideTimeout);
                stimulusHideTimeout = null;
            }
            hideReminderText();
            document.getElementById('trialDisplay').style.display = 'none';
            isIntertrialInterval = true;
            
            currentTrialIndex++;

            let needsReminder = false;
            if (recentResponses.length >= 6) {
                const last6 = recentResponses.slice(-6);
                const wrongCount = last6.filter(r => !r).length;
                if (wrongCount >= 3) {
                    recentResponses = [];
                    needsReminder = true;
                }
            }
            
            if (needsReminder) {
                setTimeout(() => {
                    isIntertrialInterval = false;
                    showReminder();
                }, 500);
                return;
            }
            
            if (isTrainingPhase) {
                presentTrial(500);
                return;
            }
            
            // Break every 128 trials (at 384, 256, 128 remaining)
            if (trialsPool.length === 384 || trialsPool.length === 256 || trialsPool.length === 128) {
                setTimeout(() => {
                    isIntertrialInterval = false;
                    showBreak();
                }, 500);
                return;
            }
            
            presentTrial(500);
        }
        
        document.getElementById('startButton').addEventListener('click', () => {
            if (resumeAfterReminder) {
                resumeAfterReminder = false;
                currentPhase = 'main';
                document.getElementById('instructions').style.display = 'none';
                document.getElementById('startButton').style.display = 'none';
                document.getElementById('centerLine').style.display = 'block';
                document.getElementById('neutralDisplay').style.display = 'block';
                document.getElementById('topImage').src = NEUTRAL_PATH;
                presentTrial();
            } else if (resumeAfterBreak) {
                resumeAfterBreak = false;
                currentPhase = 'main';
                document.getElementById('instructions').style.display = 'none';
                document.getElementById('startButton').style.display = 'none';
                document.getElementById('centerLine').style.display = 'block';
                document.getElementById('neutralDisplay').style.display = 'block';
                document.getElementById('topImage').src = NEUTRAL_PATH;
                presentTrial();
            } else {
                startBlock();
            }
        });
        
        loadManifest();
    </script>
</body>
</html>
